[package]
name = "tudouni-aigo-desktop"
version = "0.4.1"
description = "tudouni-aigo desktop client"
authors = ["tudouni-aigo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tudouni_aigo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
