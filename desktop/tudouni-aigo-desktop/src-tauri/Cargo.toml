[package]
name = "tudouni-aigo-desktop"
version = "5.6.0"
description = "tudouni-aigo desktop client"
authors = ["tudouni-aigo"]
edition = "2021"
# Not 1.77: `std::sync::LazyLock` needs 1.80, and `&raw mut` / `unsafe extern`
# blocks (window_theme.rs, system.rs) need 1.82. A lower claim is not harmless —
# CI or a contributor on 1.77 would fail with a syntax error rather than a
# useful message.
rust-version = "1.82"

[lib]
name = "tudouni_aigo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# The Remote Backend's transport: a non-interactive SSH session carrying the
# runtime's stdin/stdout/stderr, the same way `std::process::Command` carries
# a local child's. `vendored-openssl` builds its own copy of OpenSSL rather
# than linking the system one, which is what keeps this from becoming a new
# system-library requirement on every build host — the same reasoning that
# keeps ripgrep vendored under `tools/vendor/rg/` rather than assumed to be on
# PATH. Pinned to an exact version rather than a range, matching this file's
# existing pins.
#
# `openssl-on-win32` is not optional. On Windows, `libssh2-sys` only compiles
# libssh2 with a crypto backend when that feature is set (`build.rs` defines
# `LIBSSH2_OPENSSL` only under `CARGO_FEATURE_OPENSSL_ON_WIN32`); without it,
# public-key authentication cannot parse or sign with any key and fails as an
# opaque `Session(-1) unknown error` (rust-lang/ssh2-rs#221), while password
# auth — which never touches the crypto backend — keeps working. That is
# exactly the failure this feature removes, and it is what makes a key the
# wizard prefill offers actually work. It links the same vendored OpenSSL the
# `vendored-openssl` feature already builds, so it adds no new dependency.
ssh2 = { version = "=0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }
# Reads the release archives bundled under `remote-packages/` so their
# contents can be uploaded over SFTP one file at a time — `remote_install.rs`
# never writes a zip, only reads the ones `make release` already built with
# the `Deflate` method (see `release.Layout.Zip` on the Go side). `deflate`
# is the feature that actually wires up a decompressor: the crate's
# narrower `deflate-flate2` only sets an internal capability marker and does
# nothing by itself unless something else also activates its optional
# `flate2` dependency, which only `deflate` (and the zlib/zlib-ng variants,
# which would add a system library requirement this project avoids
# elsewhere) does. The cost of using it is `zopfli`, a write-side
# compression optimiser this read-only use never calls — accepted rather
# than patched around, since this crate version has no feature that
# separates "a deflate decoder" from "the whole deflate feature set."
# Pinned to an exact version, matching this file's existing pins.
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
# The config-sync content fingerprint (§9.5): a plain SHA256 of
# config.json's bytes, compared against a stored baseline rather than a
# modification time. A pure-Rust implementation rather than reaching for
# OpenSSL (already linked in for `ssh2`): that build only exposes the C
# library's build artifacts to `ssh2` itself, not a Rust API this crate can
# call, and pulling in the `openssl` wrapper crate on top of
# `vendored-openssl` for one hash of a few-KB file is a larger dependency
# than this one small crate. Pinned to an exact version, matching this
# file's existing pins.
sha2 = "=0.10.9"
# The WinRT toast API, **for the click**. `tauri-plugin-notification` shows a
# toast on every platform, but on desktop that is all it does: its `notify`
# command drops the notification handle inside `show()` and reports nothing about
# activation (its own JS documents `onAction` as mobile-only). A toast whose
# click has to open its own session therefore has to be built on the API
# underneath the plugin — the same version, already in the tree as notify-rust's
# Windows backend, so this adds no new build.
#
# Windows-only, because it is the only platform that hands activation back to the
# process that showed the toast. Everywhere else delivery stays with the plugin.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# Reading one DWORD out of `HKCU\...\Themes\Personalize`. This is how the
# window's background colour is chosen *before* the window is shown, so the
# first frame the person sees is already the right colour rather than white.
#
# A direct dependency rather than a transitive one, because `windows-sys` is
# re-exported by nobody and a transitive version is free to change. The version
# is the one already in the tree (`winreg` pulls the same), so this compiles an
# existing crate and adds nothing to the build.
#
# Reading the registry rather than asking the window is deliberate: the window's
# theme accessor blocks on a message to the event loop, and this runs inside
# `setup`, which runs *before* the event loop starts — asking it there would
# deadlock the launch it is trying to improve. `tao` reads the same two keys
# (`dark_mode.rs`), so doing it directly agrees with what the window will think.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }

# The OS's own view of what this application is using: the front end polls
# `resource_usage` on a slow tick and draws one chip in the status bar. The
# percentage is a *delta*, so the single `System` handle lives for the whole
# process (see `SYSTEM` in lib.rs) — minting one per call would read 0.0
# forever.
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is **load-bearing, not a preference**. `config.json`'s
# `providers` object is read in file order, and the first route with a key is the
# default route (`internal/state/catalog.go`, `Registry.DefaultProvider`).
# Without this feature `serde_json` backs objects with a `BTreeMap`, so a single
# save from the config panel would re-sort the routes — silently handing the
# default route to whichever name sorts first, and re-arranging the `/model`
# list — while nothing anywhere reported it. JSON objects have no order of their
# own, so this is the only thing that keeps it.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
